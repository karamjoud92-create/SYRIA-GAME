// ---------- people ----------
function personas(s){
  const P = s.policy, rw = realWage(s), infl = Math.max(0, s.infl - 20);
  const h = id => provHours(s, id);
  const breadC = { full:5, partial:8, removed:15 }[P.bread], trans = { full:4, partial:7, market:11 }[P.fuel];
  const out = {};
  // Rana
  { const gen = (24 - h('aleppo')) * 1.1, bro = s.flags.unified || s.flags.remitBoost ? 45 : 32;
    const inc = [['salary', rw], ['side', 12], ['brother', bro]], exp = [['food', 36 * (1 + infl / 200)], ['bread', breadC], ['generator', gen], ['transport', trans], ['rent', 18]];
    const why = gen > 14 ? 'why_power' : rw < 22 ? 'why_pay' : breadC > 10 ? 'why_bread' : null; out.rana = { inc, exp, why }; }
  // Abu Khaled
  { const drought = s.flags.droughtUntil && s.turn <= s.flags.droughtUntil;
    const crop = 95 * (drought ? 0.45 : 1) * (1 - s.provs.hasakeh.jobless / 260) * (built(s, 'hasakeh') ? 1.25 : 1) * { full:1.15, partial:1, removed:0.9 }[P.bread] * (1 - Math.max(0, s.provs.hasakeh.u - 60) / 100);
    const diesel = { full:8, partial:14, market:22 }[P.fuel];
    const inc = [['crop', crop]], exp = [['diesel', diesel], ['seeds', 15 * (1 + infl / 150)], ['food', 30 * (1 + infl / 200)], ['bread', breadC * 0.6], ['generator', (24 - h('hasakeh')) * 0.6]];
    const why = drought ? 'why_drought' : diesel > 15 ? 'why_power' : s.provs.hasakeh.jobless > 45 ? 'why_nojobs' : null; out.khaled = { inc, exp, why: why === 'why_power' ? null : why }; }
  // Hiba
  { const pv = s.provs.rif, homeBack = hasDecree(s, 'restitution');
    const inc = [['labor', 55 * (1 + (s.cap - 20) / 120) * (1 - pv.u / 250)]];
    const rent = homeBack ? 0 : 18 + 22 * (pv.dmg / pv.dmg0);
    const exp = [['rent', rent], ['food', 28 * (1 + infl / 200)], ['bread', breadC], ['generator', (24 - h('rif')) * 0.8], ['transport', trans]];
    out.hiba = { inc, exp, why: homeBack ? 'why_homeback' : 'why_home' }; }
  // Samer
  { const hd = h('damascus'), bribe = s.corr * 0.35;
    const inc = [['shop', 75 * (1 + (s.cap - 20) / 100) * clamp(hd / 12, 0.45, 1.4) * (P.tax === 'aggressive' ? 0.9 : 1)]];
    const exp = [['generator', (24 - hd) * 1.8], ['bribes', bribe], ['stock', 20 * (1 + infl / 100)], ['rent', 28], ['food', 30 * (1 + infl / 200)]];
    const why = (24 - hd) * 1.8 > 25 ? 'why_power' : bribe > 18 ? 'why_bribes' : infl > 10 ? 'why_fx' : null; out.samer = { inc, exp, why }; }
  Object.values(out).forEach(o => { o.i = o.inc.reduce((a, x) => a + x[1], 0); o.e = o.exp.reduce((a, x) => a + x[1], 0); o.net = o.i - o.e; const r = o.i / o.e;
    o.status = r >= 1.08 ? 's_ok' : r >= 0.9 ? 's_tight' : (s.trust < 35 ? 's_leave' : 's_bad'); o.mood = r >= 1.08 ? '🙂' : r >= 0.9 ? '😐' : '😟'; });
  return out;
}

// ---------- supply chains ----------
function chains(s){
  const east = (s.provs.hasakeh.u + s.provs.raqqa.u) / 2, drought = s.flags.droughtUntil && s.turn <= s.flags.droughtUntil;
  const hrs = nationalHours(s), rw = realWage(s), R = s.reserves;
  const lvl = (bad, weak) => bad ? 2 : weak ? 1 : 0;
  const bread = [
    ['farms', lvl(east > 70 || (drought && east > 55), east > 55 || drought), 'r_farms'],
    ['silos', built(s, 'hasakeh') ? 0 : 1, 'r_silos'],
    ['ports', lvl(R < 120, R < 300), 'r_ports'],
    ['mills', lvl(hrs < 3, hrs < 6), 'r_mills'],
    ['trucks', lvl(R < 100, s.provs.deir.u > 65 || s.policy.fuel === 'market' && R < 250), 'r_trucks'],
    ['bakeries', s.policy.bread === 'removed' ? 1 : 0, 'r_bak'],
    ['families', lvl(rw < 15, rw < 25), 'r_fam'],
  ];
  const eastAll = (s.provs.deir.u + s.provs.hasakeh.u + s.provs.raqqa.u) / 3;
  const energy = [
    ['oilfields', lvl(eastAll > 70, !(hasDecree(s, 'tribal') || hasDecree(s, 'northeast')) || eastAll > 55), 'r_oil'],
    ['fuelimp', lvl(R < 100, R < 250), 'r_fimp'],
    ['refinery', built(s, 'homs') ? 0 : 1, 'r_ref'],
    ['plants', lvl(s.mw / s.demand < 0.25, s.mw / s.demand < 0.5), 'r_pl'],
    ['gridlines', s.policy.capex >= 20 ? 0 : 1, 'r_grid'],
    ['homes', lvl(hrs < 6, hrs < 12), 'r_homes'],
  ];
  const status = ch => { const b = ch.filter(x => x[1] === 2).length, w = ch.filter(x => x[1] === 1).length; return b >= 2 ? 2 : (b || w >= 2) ? 1 : 0; };
  return { bread, energy, sb:status(bread), se:status(energy) };
}

  const first = vals[0], last = vals[vals.length - 1], cls = Math.abs(last - first) < 1e-6 ? 'muted' : (last > first) === goodUp ? 'good' : 'bad';
  const zy = (h - 6 - (0 - mn) / rng * (h - 12)).toFixed(1);

// ---------- "why did this happen?" ----------
function whyChains(before, after){
  const W = WHY[LANG], w = after.last.why, out = [];
  const step = (txt, cls) => ({ txt, cls });
  // 1) currency chain
  if (Math.abs(w.pct) >= 1){
    const f = w.fx, up = w.pct > 0, cand = [
      [f.print, fill(W.print, [after.policy.print])], [f.reserves, f.reserves > 0 ? W.reserves : W.reservesGood], [f.deficit, W.deficit],
      [f.trust, f.trust > 0 ? W.lowTrust : W.highTrust], [f.intervene, W.intervene], [f.shock, W.shock]];
    const drivers = cand.filter(([v]) => up ? v > 0.5 : v < -0.5).map(([v, l]) => [Math.abs(v), l]);
    drivers.sort((a, b) => b[0] - a[0]);
    const c = [step(drivers.length ? drivers.slice(0, 2).map(d => d[1]).join(AR() ? ' + ' : ' + ') : W.base, 'cause'),
      step(w.pct > 0 ? fill(W.fxUp, [w.pct.toFixed(1)]) : fill(W.fxDown, [w.pct.toFixed(1)]), w.pct > 0 ? 'bad' : 'good')];
    const dp = w.rw1 - w.rw0;
    if (Math.abs(dp) >= 0.3) c.push(step(dp < 0 ? fill(W.payDown, [Math.abs(dp).toFixed(1)]) : fill(W.payUp, [dp.toFixed(1)]), dp < 0 ? 'bad' : 'good'));
    const dt = w.trustAfter - w.trustBefore;
    if (Math.abs(dt) >= 0.5 && dp * dt > 0) c.push(step(dt < 0 ? fill(W.trustDown, [Math.abs(dt).toFixed(1)]) : fill(W.trustUp, [dt.toFixed(1)]), dt < 0 ? 'bad' : 'good'));
    out.push({ icon:'💱', steps:c, weight:Math.abs(w.pct) * 2 });
  }
  // 2) trust chain
  { const dt = w.trustAfter - w.trustBefore;
    if (Math.abs(dt) >= 0.5){
      const parts = Object.entries(w.trustParts).filter(([k]) => k !== 'base').map(([k, v]) => [k, v]).filter(x => Math.abs(x[1]) >= 1.5)
        .sort((a, b) => (dt < 0 ? a[1] - b[1] : b[1] - a[1])).slice(0, 2);
      if (parts.length) out.push({ icon:'🤝', weight:Math.abs(dt) * 1.5, steps:[step(parts.map(([k, v]) => `${W['t_' + k]} (${sign(v, 0)})`).join(' + '), 'cause'),
        step(dt < 0 ? fill(W.trustDown, [Math.abs(dt).toFixed(1)]) : fill(W.trustUp, [dt.toFixed(1)]), dt < 0 ? 'bad' : 'good')] });
    } }
  // 3) anger chain
  { const da = natUnrest(after) - natUnrest(before);
    if (Math.abs(da) >= 0.5){
      const parts = Object.entries(w.angerParts).filter(x => (da > 0 ? x[1] >= 2 : x[1] <= -2)).sort((a, b) => da > 0 ? b[1] - a[1] : a[1] - b[1]).slice(0, 2);
      if (parts.length) out.push({ icon:'🔥', weight:Math.abs(da) * 1.5, steps:[step(parts.map(([k]) => W[(da > 0 ? 'a_' : 'b_') + k]).join(' + '), 'cause'),
        step(da > 0 ? fill(W.angerUp, [da.toFixed(1)]) : fill(W.angerDown, [Math.abs(da).toFixed(1)]), da > 0 ? 'bad' : 'good')] });
    } }
  // 4) budget chain
  { const d = after.treasury - before.treasury, rows = after.last.ledger.syp;
    if (Math.abs(d) >= 3){
      const big = rows.slice().sort((a, b) => d < 0 ? a[1] - b[1] : b[1] - a[1])[0];
      const c = [step(fill(d < 0 ? W.biggestCost : W.biggestIncome, [LEDGER[LANG][big[0]] || big[0]]), 'cause'), step(fill(d < 0 ? W.cashDown : W.cashUp, [Math.abs(d).toFixed(1)]), d < 0 ? 'bad' : 'good')];
      if (after.treasury < 0 && d < 0) c.push(step(W.deficit, 'bad'), step(AR() ? 'الدولار يغلو' : 'Dollar gets pricier', 'bad'));
      out.push({ icon:'💵', weight:Math.abs(d) / 3, steps:c });
    } }
  // 5) delayed power
  { const done = after.last.notes.find(n => n[0] === 'gridDone'), dh = w.hrs1 - w.hrs0;
    if (done && dh > 0.1) out.push({ icon:'⚡', weight:4, steps:[step(W.gridArrived + ` (+${done[1]} MW)`, 'cause'), step(fill(W.powerUp, [dh.toFixed(1)]), 'good'), step(W.a_power + ' ↓', 'good')] }); }
  return out.sort((a, b) => b.weight - a.weight).slice(0, 3);
}

  if (!chs.length) return `<p class="muted">${WHY[LANG].noneYet}</p>`;

// ---------- cycles ----------
function detectCycles(){
  const H = S.history, n = H.length; if (n < 3) return [];
  const a = H[n - 3], b = H[n - 2], c = H[n - 1], found = [];
  if (b.print > 0 && c.print > 0 && c.fx > b.fx && b.fx > a.fx && c.pay < b.pay) found.push('printing');
  if (b.capex > 0 && c.capex > 0 && c.mw > a.mw + 150 && c.cap > a.cap && c.usd > b.usd) found.push('growth');
  if (c.trust > b.trust && b.trust > a.trust && c.privB > 0.1 && c.anger < a.anger) found.push('trust');
  if (c.contagion > 1 && c.anger > b.anger) found.push('anger');
  if (c.debt > a.debt && c.usd < b.usd && b.usd < a.usd) found.push('debt');
  return found.filter(id => !(S.cycles || []).includes(id));
}
function cycleSvg(id){
  const cy = CYCLE_TXT[id], nodes = L2(cy)[1], N = nodes.length, R = 118, cx = 170, cyy = 150, col = cy.bad ? 'var(--revolt)' : 'var(--calm)';
  const pos = nodes.map((_, i) => { const ang = -Math.PI / 2 + i * 2 * Math.PI / N; return [cx + R * Math.cos(ang), cyy + R * Math.sin(ang)]; });
  // Where the line leaves a pill: the ray from the centre, clipped by that pill's own box.
  // (The old version offset x and y by different amounts, which pulled both ends off the line
  //  and left nothing but a floating arrowhead.)
  const halfW = nodes.map(txt => Math.max(124, txt.length * 7.2 + 26) / 2 + 7), halfH = 16 + 7;
  const arcs = pos.map((p, i) => { const j = (i + 1) % N, q = pos[j], dx = q[0] - p[0], dy = q[1] - p[1], len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
    const edge = k => Math.min(Math.abs(ux) > 1e-6 ? halfW[k] / Math.abs(ux) : 1e6, Math.abs(uy) > 1e-6 ? halfH / Math.abs(uy) : 1e6);
    const a = Math.min(edge(i), len * 0.42), b = Math.min(edge(j) + 9, len * 0.42);   // +9 leaves room for the arrowhead
    const s0 = [p[0] + ux * a, p[1] + uy * a], e0 = [q[0] - ux * b, q[1] - uy * b];
    const mxp = (s0[0] + e0[0]) / 2, myp = (s0[1] + e0[1]) / 2, ox = (mxp - cx) * 0.25, oy = (myp - cyy) * 0.25;
    return `<path d="M${s0[0].toFixed(1)},${s0[1].toFixed(1)} Q${(mxp + ox).toFixed(1)},${(myp + oy).toFixed(1)} ${e0[0].toFixed(1)},${e0[1].toFixed(1)}" fill="none" stroke="${col}" stroke-width="2.5" marker-end="url(#ah)"/>`; }).join('');
  // the pill grows with the label: a fixed width cut long ones in half
  const labels = nodes.map((txt, i) => { const [x, y] = pos[i], w = Math.max(124, txt.length * 7.2 + 26);
    return `<g><rect x="${(x - w / 2).toFixed(1)}" y="${y - 16}" width="${w.toFixed(1)}" height="32" rx="16" fill="var(--card-ink)" stroke="${col}" stroke-width="1.5"/><text x="${x}" y="${y + 5}" text-anchor="middle" class="cyc">${esc(txt)}</text></g>`; }).join('');
  return `<svg viewBox="-60 0 460 300" class="cyclesvg" direction="ltr" aria-hidden="true"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="${col}"/></marker></defs>${arcs}${labels}<text x="${cx}" y="${cyy + 6}" text-anchor="middle" font-size="30">${cy.bad ? '🔻' : '🔺'}</text></svg>`;
}

function investValue(id){
  const o = oilNumbers(S);
  switch(id){
    case 'oilwells': return 25 * o.access * o.security * 2.0 * 2;
    case 'refinery': return Math.min(20, Math.max(0, o.prod * S.policy.oilHome - o.refineCap)) * 0.4 * 2;
    case 'gasfield': return 18;
    case 'offshore': return 30;
    case 'phosphate': return 35 * 0.35 * (1 - S.provs.homs.u / 150) * 2 * (dealOn(S, 'china') ? 0.7 : 1);
    case 'farm': return 20 * (dealOn(S, 'eu') ? 1.25 : 1);
    case 'tourism': { const n = (S.ind && S.ind.tourism) || 0; const cur = tourismIncome(S);
      return cur > 0 ? cur / Math.max(1, n) * 2 : 18 * clamp(1.25 - natUnrest(S) / 55, 0, 1.1) * clamp(nationalHours(S) / 14, 0.3, 1) * 2; }
  }
  if (IND[id]) return IND[id].exp * 2 * (dealOn(S, 'eu') ? 1.25 : 1) + (IND[id].wheatCut || 0) * 2;
  return 0;
}

    case 'drawer': UI.drawer = UI.drawer === v ? null : v; if (v === 'progress') UI.newCycle = false; if (v === 'money') guideTick('money'); if (UI.drawer && isPhone()) UI.provOpen = false; break;

    case 'pol': { const k = b.dataset.k, val = POL_VALUES[k].find(o => String(o) === v); if (S.policy[k] === val) break; const p = L2(POL[k]);
      withEffects(`${p.name}: ${p.opts[String(val)]}`, () => { S.policy[k] = val; return true; }); guideTick('policy'); persist(); break; }

function mpAgo(ms){
  const m = Math.floor(ms / 60000);
  if (m < 1) return t('mpNow');
  if (m < 60) return fill(t('mpMinAgo'), [m]);
  const h = Math.floor(m / 60);
  return h < 24 ? fill(t('mpHrAgo'), [h]) : fill(t('mpDayAgo'), [Math.floor(h / 24)]);
}
function mpWhen(e){
  const when = MONTHS[LANG][((e.t % 12) + 12) % 12] + ' ' + (START_YEAR + Math.floor(e.t / 12));
  const what = e.over === 'fail' ? t('mpFell') : e.over === 'end' ? t('mpFinished') : t('mpPlaying');
  return when + ' · ' + what;
}

// ===== Decisions come to you =====
// The rest of this game asks the player to go looking: open a panel, find a subtab, read a card,
// decide. That is fine once you know the game and hopeless on your first evening with it. This
// layer turns the same systems into what a casual player actually wants — one question at a time,
// two or three answers, and the consequence shown before you commit. The simulation underneath is
// untouched: every option here calls the same ACT.* the panels call.

UI.deck = []; UI.decSkip = {}; UI.decHide = false;

const decMonths = 10;                                   // how long a skipped question stays away
// month 0 is a real month: `|| -99` would treat a skip at t=0 as never having happened
const decSkipped = id => (UI.decSkip[id] === undefined ? -99 : UI.decSkip[id]) > S.t - decMonths;
function decSkip(id){ UI.decSkip[id] = S.t; }

// ---------- building the questions ----------
function decisionDeck(){
  if (!S || S.over) return [];
  const out = [], A = AR();
  const money = (usd, syp) => [usd ? `🏦 ${usdM(usd)}` : '', syp ? `💵 ${bn(syp)}` : ''].filter(Boolean);

  // 1. the province that is angriest and still fixable
  if (isOpen('projects')){
    const p = PROVS.map(x => ({ id:x.id, u:S.provs[x.id].u }))
      .filter(x => !S.provs[x.id].project && S.reserves + S.grant >= PROJECTS[x.id].usd && S.pc >= PROJECTS[x.id].pc
        && !decSkipped('prov_' + x.id))
      .sort((a, b) => b.u - a.u)[0];
    if (p){
      const x = PROJECTS[p.id], tx = L2(PROJ_TXT[p.id]);
      out.push({ id:'prov_' + p.id, icon:'🏗️', weight:p.u, why:t('decProv'),
        title:`${PN(p.id)}: ${tx[0]}`, text:tx[1],
        opts:[
          { label:t('decBuildT'), sub:fill(t('tenderTxt'), [monthsTxt(projMonths(p.id, 'tender')), Math.round(x.usd * projLeakRate(S, 'tender'))]), chips:money(x.usd, x.syp),
            run:() => withEffects(`${PN(p.id)}: ${tx[0]}`, () => ACT.project(S, p.id, 'tender')) && guideTick('project') },
          { label:t('decBuildF'), sub:fill(t('fastTxt'), [monthsTxt(projMonths(p.id, 'fast')), Math.round(x.usd * projLeakRate(S, 'fast'))]), chips:money(x.usd, x.syp),
            run:() => withEffects(`${PN(p.id)}: ${tx[0]}`, () => ACT.project(S, p.id, 'fast')) && guideTick('project') },
        ] });
    }
  }

  // 2. a policy that is visibly hurting
  if (S.policy.print >= 15 && isOpen('polPrint') && !decSkipped('pol_print')){
    const pol = L2(POL.print);
    out.push({ id:'pol_print', icon:'🖨️', weight:70, why:t('decPolicy'), title:pol.name, text:pol.hint[String(S.policy.print)],
      opts:[{ label:pol.opts['0'], sub:pol.hint['0'], chips:[], run:() => withEffects(`${pol.name}: ${pol.opts['0']}`, () => { S.policy.print = 0; return true; }) }] });
  }
  if (S.treasury < -15 && S.policy.fuel !== 'market' && isOpen('policy') && !decSkipped('pol_fuel')){
    const pol = L2(POL.fuel);
    out.push({ id:'pol_fuel', icon:'⛽', weight:64, why:t('decPolicy'), title:pol.name, text:pol.hint[S.policy.fuel],
      opts:[{ label:pol.opts.market, sub:pol.hint.market, chips:[], run:() => withEffects(`${pol.name}: ${pol.opts.market}`, () => { S.policy.fuel = 'market'; return true; }) }] });
  }

  // 3. people are paid less than they expect
  if (isOpen('money') && !cooldown('lastRaise', 6) && realWage(S) < (S.expWage || 25) - 6 && S.treasury > 5 && !decSkipped('wage')){
    out.push({ id:'wage', icon:'👷', weight:60, why:t('decWage'), title:t('raiseTitle'),
      text:fill(t('raiseText'), [realWage(S).toFixed(0), (S.expWage || 25).toFixed(0)]),
      opts:[10, 25].map(v => ({ label:'+' + v + '%', sub:'', chips:[],
        run:() => withEffects(`${t('raiseTitle')} +${v}%`, () => { ACT.wage(S, v); S.flags.lastRaise = S.t; return true; }) })) });
  }

  // 4. schools and clinics behind the population
  if (isOpen('services')){
    const short = Object.keys(SERVICES).filter(k => (k !== 'unis' || isOpen('unis')) && svcCover(S, k) < 0.85
      && S.reserves >= SERVICES[k].usd && !S.pipe.some(q => q.kind === 'svc' && q.id === k)
      && !(SERVICES[k].req && !SERVICES[k].req(S))).sort((a, b) => svcCover(S, a) - svcCover(S, b))[0];
    if (short && !decSkipped('svc_' + short)){
      const x = SERVICES[short];
      out.push({ id:'svc_' + short, icon:SVC_ICON[short], weight:58 + (1 - svcCover(S, short)) * 20, why:t('decSvc'),
        title:svcLabel(short), text:{ schools:t('svcSchoolsTxt'), clinics:t('svcClinicsTxt'), unis:t('svcUnisTxt') }[short],
        opts:[{ label:t('svcBuild'), sub:fill(t('svcCover'), [S.svc[short] || 0, svcNeed(S, short)]), chips:money(x.usd, x.syp),
          run:() => withEffects(svcLabel(short), () => ACT.service(S, short)) }] });
    }
  }

  // 5. nothing is being made here
  if (isOpen('sectors')){
    const k = Object.keys(INVEST).filter(id => INVEST[id].sector && (!INVEST[id].supply || isOpen('supply'))
      && S.reserves >= INVEST[id].usd && (S.invests[id] || 0) < (INVEST[id].max || 3)
      && !S.pipe.some(q => q.kind === 'invest' && q.id === id) && !(INVEST[id].req && !INVEST[id].req(S)))
      .sort((a, b) => (INVEST[b].jobs || 0) - (INVEST[a].jobs || 0))[0];
    if (k && !decSkipped('inv_' + k)){
      const x = INVEST[k], tx = L2(INV_TXT[k]);
      out.push({ id:'inv_' + k, icon:INV_TXT[k].icon, weight:50 + (joblessNat(S) - 40) * 0.5, why:t('decSector'),
        title:tx[0], text:tx[1],
        opts:[{ label:t('investBtn'), sub:fill(t('jobsChip'), ['+' + x.jobs]), chips:money(x.usd, 0),
          run:() => withEffects(tx[0], () => ACT.invest(S, k)) }] });
    }
  }

  // 6. a neighbour is offering something
  if (isOpen('partners')){
    const k = Object.keys(PARTNERS).filter(id => !S.deals[id] && S.pc >= PARTNERS[id].pc
      && !(PARTNERS[id].usd && S.reserves < PARTNERS[id].usd) && !(PARTNERS[id].signReq && !PARTNERS[id].signReq(S)))
      .sort((a, b) => PARTNERS[a].sov - PARTNERS[b].sov)[0];
    if (k && !decSkipped('deal_' + k)){
      const tx = L2(PART_TXT[k]);
      out.push({ id:'deal_' + k, icon:PARTNERS[k].flag, weight:44, why:t('decDeal'), title:`${tx[0]}: ${tx[1]}`, text:tx[2],
        opts:[{ label:t('dealSign'), sub:tx[3], chips:[`⭐ ${PARTNERS[k].pc}`].concat(PARTNERS[k].sov ? [`${t('independence')} ${MINUS}${PARTNERS[k].sov}`] : []),
          run:() => withEffects(`${tx[0]}: ${tx[1]}`, () => ACT.deal(S, k)) }] });
    }
  }

  // 7. influence burning a hole in your pocket
  if (isOpen('decrees') && S.pc >= 35){
    const k = DECREES.filter(d => S.decrees[d.id] === undefined && S.pc >= d.pc && S.reserves >= (d.usd || 0)
      && !(d.req && !d.req(S))).sort((a, b) => b.pc - a.pc)[0];
    if (k && !decSkipped('dec_' + k.id)){
      const tx = L2(DEC_TXT[k.id]);
      out.push({ id:'dec_' + k.id, icon:'⭐', weight:40, why:t('decDecree'), title:tx[0], text:tx[1],
        opts:[{ label:t('choose'), sub:tx[2], chips:[`⭐ ${k.pc}`].concat(money(k.usd, k.syp)),
          run:() => withEffects(tx[0], () => ACT.decree(S, k.id)) }] });
    }
  }

  // 8. foreign partners have a grip, and there is money in the bank to loosen it. Only asked
  //    once it actually bites (grip > 0) and only when the player can pay for it, like every
  //    other question here — and it carries the highest weight, because it is a spiral.
  if (S.debt > 0 && grip(S) > 0 && !decSkipped('sovBuy')){
    const sov0 = S.sov0 === undefined ? 60 : S.sov0, room = Math.max(0, sov0 - S.sov);
    const spare = Math.max(0, S.reserves - 300);
    const amt = Math.min(S.debt, spare >= 1000 ? 1000 : 250);
    if (room > 0 && amt >= 250 && spare >= amt){
      out.push({ id:'sovBuy', icon:'\u{1F9ED}', weight:70, why:t('decSov'), title:t('repayTitle'), text:t('sovBiteLong'),
        opts:[{ label:fill(t('decSovPay'), [usdM(amt)]), sub:t('decSovSub'),
          chips:[`\u{1F3E6} ${usdM(amt)}`, `${t('independence')} +${Math.min(room, amt / SOV_PER_USD).toFixed(1)}`],
          run:() => withEffects(t('repayTitle'), () => ACT.repay(S, amt)) }] });
    }
  }

  return out.sort((a, b) => b.weight - a.weight);
}

// ---------- the card ----------
function renderDeck(){
  const box = $('#deckbox'); if (!box) return;
  if (!S || S.over || UI.decHide || UI.drawer || UI.provOpen || $('#modal').innerHTML.trim()){ box.innerHTML = ''; return; }
  const deck = decisionDeck(); UI.deck = deck;
  if (!deck.length){ box.innerHTML = ''; return; }
  const d = deck[0];
  box.innerHTML = `<div class="deck" role="group" aria-label="${t('decHeading')}">
    <button class="close" data-act="decHide" aria-label="${t('hide')}">✕</button>
    <div class="dhead"><span class="dico" aria-hidden="true">${d.icon}</span>
      <div><div class="dwhy">${esc(d.why)}</div><h3>${esc(d.title)}</h3></div></div>
    <p class="dtext">${esc(d.text)}</p>
    ${d.opts.map((o, i) => `<button class="opt" data-act="decPick" data-i="${i}"><b>${esc(o.label)}</b>${o.sub ? `<span class="t">${esc(o.sub)}</span>` : ''}
      <span class="chips">${o.chips.map(c => `<span class="chip">${esc(c)}</span>`).join('')}</span></button>`).join('')}
    <div class="row"><button class="btn small" data-act="decLater">${t('decLater')}</button>${deck.length > 1 ? `<button class="btn small" data-act="decNext">${t('decSkip')} →</button>` : ''}</div></div>`;
}

// ---------- hooks ----------
const decBaseFrame = ensureFrame;
ensureFrame = function(){
  decBaseFrame();
  if (!$('#deckbox')){ const b = $('#board'); if (b){ const e = document.createElement('div'); e.id = 'deckbox'; b.appendChild(e); } }
};
const decBaseRender = render;
render = function(force){ decBaseRender(force); renderDeck(); };

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a !== 'decPick' && a !== 'decLater' && a !== 'decNext' && a !== 'decHide' && a !== 'decShow') return;
  const d = UI.deck[0];
  if (a === 'decHide'){ UI.decHide = true; return render(true); }
  if (a === 'decShow'){ UI.decHide = false; return render(true); }
  if (!d) return;
  if (a === 'decLater'){ decSkip(d.id); persist(); return render(true); }
  if (a === 'decNext'){ decSkip(d.id); persist(); return render(true); }
  if (a === 'decPick'){ const o = d.opts[+b.dataset.i]; if (o && o.run) o.run(); persist(); return render(true); }
});

</script>
